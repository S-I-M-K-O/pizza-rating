services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DATA_FILE: /app/data/data.json
    volumes:
      # Mount the directory (not the file) so saves can be atomic temp-file + rename,
      # and a missing data.json doesn't get created as a directory by Docker.
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
